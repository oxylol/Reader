services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal paths (mounted volumes below).
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/inkvault.db}
      LIBRARY_DIR: /data/library
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
    volumes:
      - data:/data
    depends_on:
      - flaresolverr
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    expose:
      - "8191"

  # Optional Postgres — enable by setting DATABASE_URL to the asyncpg URL and
  # uncommenting asyncpg in backend/requirements.txt.
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: inkvault
  #     POSTGRES_PASSWORD: inkvault
  #     POSTGRES_DB: inkvault
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  data:
  # pgdata:
